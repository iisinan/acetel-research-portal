[phases.setup]
nixPkgs = ["...", "libatomic1"]

[phases.build]
cmds = ["composer install --optimize-autoloader --no-scripts --no-interaction", "npm install", "npm run build"]

[phases.deploy]
cmds = ["php artisan migrate --force", "php artisan config:cache || true", "php artisan route:cache || true", "php artisan view:cache || true", "php artisan event:cache || true", "export PHP_CLI_SERVER_WORKERS=10 && exec php artisan serve --host 0.0.0.0 --port $PORT --no-reload"]
